<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>태풍 키우기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --panel-bg: rgba(6,18,30,0.86);
    --panel-border: rgba(79,209,197,0.45);
    --cyan:#4fd1c5; --amber:#ffb347; --red:#ff5a5a;
    --text:#e8f1f2; --text-dim:#9db3ba;
    --font-display:'Arial Narrow',Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#061726; font-family:var(--font-body); color:var(--text); overscroll-behavior:none; }
  #app{position:fixed; inset:0; width:100%; height:100%;}
  #map{position:absolute; inset:0; width:100%; height:100%; background:#0b1826;}

  /* OSM 타일을 어둡게 반전시켜 레이더 관제 느낌으로 */
  .leaflet-tile-pane{ filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.92) saturate(0.9); }
  .leaflet-control-attribution{ font-size:9px; background:rgba(6,18,30,0.7) !important; color:var(--text-dim) !important; }
  .leaflet-control-attribution a{ color:var(--cyan) !important; }
  .city-label{ background:none!important; border:none!important; box-shadow:none!important;
    color:#e8f1f2!important; font-size:11px!important; text-shadow:0 1px 3px rgba(0,0,0,0.9); }
  .city-label::before{ display:none!important; }

  .bracket-panel{ position:relative; background:var(--panel-bg); border:1px solid var(--panel-border); padding:10px 14px; backdrop-filter: blur(3px); }
  .bracket-panel .tl,.bracket-panel .tr,.bracket-panel .bl,.bracket-panel .br{
    content:''; position:absolute; width:10px; height:10px; border-color:var(--cyan); border-style:solid; opacity:0.9; }
  .bracket-panel .tl{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .bracket-panel .tr{ top:-1px; right:-1px; border-width:2px 2px 0 0; }
  .bracket-panel .bl{ bottom:-1px; left:-1px; border-width:0 0 2px 2px; }
  .bracket-panel .br{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  #newsTicker{
    position:absolute; top:0; left:0; right:0; height:30px; z-index:950;
    background:rgba(18,4,4,0.9); border-bottom:1px solid rgba(255,90,90,0.55);
    display:none; align-items:center; gap:9px; padding:0 12px; overflow:hidden;
  }
  #newsTicker.show{display:flex;}
  #newsBadge{ background:#ff2d2d; color:#fff; font-size:10px; font-weight:700; padding:3px 7px; letter-spacing:0.03em; flex-shrink:0; }
  #newsText{ font-size:12.5px; color:#f4ecec; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transform:translateY(4px); }
  #newsText.fadein{ animation:newsFade 0.4s ease forwards; }
  @keyframes newsFade{ to{ opacity:1; transform:translateY(0); } }

  #hud{ position:absolute; top:40px; left:14px; right:14px; display:none;
    justify-content:space-between; align-items:flex-start; gap:10px; pointer-events:none; z-index:900; }
  #hud.show{display:flex;}
  #hudLeft{ min-width:180px; pointer-events:auto; }
  #stormName{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  #rankLabel{ font-size:12px; color:var(--cyan); margin-top:2px; font-weight:600;}
  #powerBarOuter{ margin-top:8px; width:100%; height:9px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); }
  #powerBarInner{ height:100%; width:32%; background:var(--cyan); transition:width 0.15s linear, background-color 0.3s; }
  #powerText{ font-size:11px; color:var(--text-dim); margin-top:4px; font-variant-numeric: tabular-nums;}
  #hudRight{ text-align:right; pointer-events:auto; min-width:150px; }
  #scoreLabel{ font-size:11px; color:var(--text-dim); }
  #scoreValue{ font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--amber); font-variant-numeric: tabular-nums;}
  #scoreTarget{ font-size:11px; color:var(--text-dim); }
  #pauseBtn{ margin-top:8px; pointer-events:auto; cursor:pointer; background:var(--panel-bg); border:1px solid var(--panel-border);
    color:var(--text); font-size:12px; padding:5px 10px; }

  #joystickZone{ position:absolute; left:0; bottom:0; width:46%; height:42%; display:none; z-index:900; touch-action:none; }
  #joystickZone.show{display:block;}
  #joyBase{ position:absolute; left:30px; bottom:30px; width:118px; height:118px; border-radius:50%;
    background:radial-gradient(circle, rgba(79,209,197,0.14), rgba(6,18,30,0.6)); border:1px solid rgba(79,209,197,0.45); }
  #joyKnob{ position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(232,241,242,0.95), rgba(79,209,197,0.55));
    transform:translate(-50%,-50%); box-shadow:0 0 12px rgba(79,209,197,0.5); }

  #typhoonSprite{ position:absolute; left:50%; top:50%; width:120px; height:120px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:650; display:none;
    --storm-color:#eaf6ff; --storm-color-light:#ffffff; }
  #typhoonSprite.show{display:block;}
  #typhoonSprite svg{ width:100%; height:100%; overflow:visible; }
  .rainbands{ transform-origin:80px 80px; animation:spinRev 9s linear infinite; }
  .spiralArms{ transform-origin:80px 80px; animation:spin 3s linear infinite; }
  .armPath{ stroke:var(--storm-color); }
  .bandPath{ stroke:var(--storm-color); }
  .wispBlob{ fill:var(--storm-color); }
  .eyewall{ stroke:var(--storm-color-light); opacity:0.8; }
  .stormGlow{ fill:url(#cloudCore); }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes spinRev{ from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
  @keyframes eyePulse{ 0%,100%{ opacity:0.85; } 50%{ opacity:0.5; } }
  .stormEye{ animation: eyePulse 2.4s ease-in-out infinite; }

  .screen{ position:absolute; inset:0; z-index:1000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px; background:rgba(4,12,20,0.4); }
  .hidden{display:none!important;}
  .title-main{ font-family:var(--font-display); font-weight:700; font-size:34px; margin:0 0 6px 0; text-align:center; text-shadow:0 2px 10px rgba(0,0,0,0.6); }
  .subtitle{ color:var(--text); font-size:13px; margin-bottom:26px; text-align:center; line-height:1.6; text-shadow:0 1px 6px rgba(0,0,0,0.7); }
  .card{ width:min(340px, 88vw); }
  .field-label{ font-size:12px; color:var(--cyan); margin-bottom:6px; }
  #nameInput{ width:100%; padding:12px 10px; background:rgba(255,255,255,0.06); border:1px solid var(--panel-border);
    color:var(--text); font-size:16px; outline:none; margin-bottom:10px; }
  #nameInput:focus{ border-color:var(--cyan); }
  .hint-names{ font-size:11px; color:var(--text-dim); margin-bottom:18px; }
  .hint-names button{ background:none; border:none; color:var(--cyan); font-size:11px; cursor:pointer; padding:0; text-decoration:underline; margin-left:4px; }
  .primary-btn{ width:100%; padding:13px; background:var(--cyan); color:#04141c; border:none;
    font-family:var(--font-display); font-weight:700; font-size:15px; cursor:pointer; }
  .primary-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .primary-btn:not(:disabled):active{ opacity:0.8; }
  .ghost-btn{ width:100%; padding:11px; background:transparent; color:var(--text-dim); margin-top:10px;
    border:1px solid rgba(255,255,255,0.25); font-size:13px; cursor:pointer; }

  #locBanner{ position:absolute; top:16px; left:16px; right:16px; z-index:900; display:none; text-align:center; padding:12px 14px; }
  #locBanner.show{display:block;}
  #locBanner .msg{ font-size:13px; }
  #locBanner .warn{ color:var(--red); }
  #locConfirmWrap{ position:absolute; left:16px; right:16px; bottom:26px; z-index:900; display:none; }
  #locConfirmWrap.show{display:block;}

  #resultScreen.inspecting .card{ display:none; }
  #resultScreen.inspecting{ background:transparent; pointer-events:none; }
  #backToResultBtn{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:1001; display:none;
    padding:10px 18px; background:var(--cyan); color:#04141c; border:none;
    font-family:var(--font-display); font-weight:700; font-size:13px; cursor:pointer; pointer-events:auto;
  }
  #backToResultBtn.show{display:block;}

  #minimapWrap{
    position:absolute; right:14px; bottom:150px; z-index:900; display:none; padding:6px;
  }
  #minimapWrap.show{display:block;}
  #minimapCanvas{ display:block; width:130px; height:72px; }

  #compassWrap{
    position:absolute; right:14px; bottom:30px; z-index:900; display:none;
    width:96px; text-align:center; padding:8px 8px;
  }
  #compassWrap.show{display:block;}
  #compassLabel{ font-size:9px; color:var(--text-dim); margin-bottom:4px; letter-spacing:0.02em; }
  #compassArrowWrap{ width:34px; height:34px; margin:0 auto; }
  #compassArrow{ width:100%; height:100%; transition: transform 0.25s ease-out; color:var(--amber); }
  #compassDist{ font-size:10px; color:var(--text); margin-top:3px; font-variant-numeric: tabular-nums; }

  @keyframes cameraShake{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,4px); }
    40%{ transform:translate(5px,-5px); }
    60%{ transform:translate(-4px,-3px); }
    80%{ transform:translate(3px,4px); }
    100%{ transform:translate(0,0); }
  }
  #map.shake{ animation:cameraShake 0.4s ease; }

  #easterEggIntro{
    position:absolute; inset:0; z-index:1050; display:none; align-items:center; justify-content:center;
    background:rgba(4,6,20,0.78); overflow:hidden;
  }
  #easterEggIntro.show{display:flex;}
  #eggAnimText{
    font-family:var(--font-display); font-weight:700; font-size:20px; color:#ffd6e8;
    text-shadow:0 0 12px rgba(255,150,200,0.7); text-align:center; padding:0 24px;
    animation:eggPulse 0.9s ease-in-out infinite;
  }
  @keyframes eggPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  .eggFloat{
    position:absolute; bottom:-24px; font-size:16px; opacity:0.9;
    animation:eggFloatUp 1.7s ease-in forwards;
  }
  @keyframes eggFloatUp{ 0%{ transform:translateY(0) rotate(0deg); opacity:0.9; } 100%{ transform:translateY(-220px) rotate(20deg); opacity:0; } }

  #alertOverlay{
    position:absolute; inset:0; z-index:1100; display:none; align-items:center; justify-content:center;
    background:rgba(180,10,10,0.22); pointer-events:none;
  }
  #alertOverlay.show{ display:flex; animation:alertFlash 0.55s ease; }
  #alertOverlay.show.persist{ animation:none; opacity:1; }
  #alertBox{
    background:rgba(30,4,4,0.92); border:2px solid #ff2d2d; padding:10px 22px; text-align:center;
    font-family:var(--font-display); font-weight:700; color:#fff; font-size:14px; letter-spacing:0.02em;
  }
  @keyframes alertFlash{ 0%{opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }

  #resultScreen .result-title{ font-family:var(--font-display); font-weight:700; font-size:30px; margin-bottom:4px; }
  #resultScreen .result-title.win{ color:var(--amber); }
  #resultScreen .result-title.lose{ color:var(--text-dim); }
  .stat-row{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
  .stat-row span:last-child{ color:var(--cyan); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="typhoonSprite">
    <svg viewBox="0 0 160 160">
      <defs>
        <radialGradient id="cloudCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--storm-color-light)" stop-opacity="0.95"/>
          <stop offset="45%" stop-color="var(--storm-color)" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="var(--storm-color)" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="eyeShade" cx="45%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#233042"/>
          <stop offset="100%" stop-color="#0a1119"/>
        </radialGradient>
        <filter id="wispBlur" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>
      </defs>

      <circle cx="80" cy="80" r="70" class="stormGlow"/>

      <!-- 외곽 레인밴드: 흩어진 구름 뭉치 + 점선 궤도 (반대 방향, 느리게 회전) -->
      <g class="rainbands" id="rainbandsGroup"></g>

      <!-- 중심 나선팔: 로그 나선 곡선 (빠르게 회전, 세력이 강할수록 빨라짐) -->
      <g class="spiralArms" id="spiralArmsGroup"></g>

      <!-- 눈벽(eyewall) -->
      <circle cx="80" cy="80" r="17" fill="none" class="eyewall" stroke-width="5" filter="url(#wispBlur)"/>

      <!-- 태풍의 눈 -->
      <circle class="stormEye" cx="80" cy="80" r="10" fill="url(#eyeShade)"/>
      <circle cx="80" cy="80" r="10" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    </svg>
  </div>

  <div id="hud">
    <div id="hudLeft" class="bracket-panel">
      <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
      <div id="stormName">태풍 —</div>
      <div id="rankLabel">최대풍속 -- km/h</div>
      <div id="powerBarOuter"><div id="powerBarInner"></div></div>
      <div id="powerText">세력 32%</div>
    </div>
    <div id="hudRight" class="bracket-panel">
      <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
      <div id="scoreLabel">누적 피해 점수</div>
      <div id="scoreValue">0</div>
      <button id="pauseBtn">일시정지</button>
    </div>
  </div>

  <div id="locBanner" class="bracket-panel">
    <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
    <div class="msg" id="locMsg">🌊 실제 지도 위에서 태풍이 발생할 바다를 탭하세요 (드래그·핀치줌 가능)</div>
  </div>
  <div id="locConfirmWrap">
    <button class="primary-btn" id="locConfirmBtn" disabled>이 위치에서 태풍 발생</button>
  </div>

  <div id="newsTicker">
    <span id="newsBadge">속보</span>
    <span id="newsText"></span>
  </div>

  <div id="easterEggIntro"></div>

  <div id="alertOverlay"><div id="alertBox">🚨 도시 초토화</div></div>

  <div id="minimapWrap" class="bracket-panel">
    <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
    <canvas id="minimapCanvas" width="130" height="72"></canvas>
  </div>

  <div id="compassWrap" class="bracket-panel">
    <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
    <div id="compassLabel">가장 가까운 목표</div>
    <div id="compassArrowWrap">
      <svg id="compassArrow" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L19 20 L12 16 L5 20 Z" fill="currentColor"/>
      </svg>
    </div>
    <div id="compassDist">-- km</div>
  </div>

  <div id="joystickZone"><div id="joyBase"><div id="joyKnob"></div></div></div>

  <div class="screen" id="nameScreen">
    <h1 class="title-main">태풍 키우기</h1>
    <p class="subtitle">실제 지구 지도(OpenStreetMap) 위에서 태풍이 되어<br/>세력을 키우고 이름을 남기세요.<br/>모바일은 화면 하단 조이스틱, PC는 방향키/WASD로 조작합니다.</p>
    <div class="card bracket-panel">
      <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
      <div class="field-label">태풍의 이름</div>
      <input id="nameInput" type="text" maxlength="10" placeholder="예: 나비, 매미, 힌남노" />
      <div class="hint-names">이름이 떠오르지 않나요?<button id="randomNameBtn">추천 이름 받기</button></div>
      <button class="primary-btn" id="toLocationBtn">다음</button>
    </div>
  </div>

  <div class="screen hidden" id="resultScreen">
    <div class="card bracket-panel">
      <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
      <div class="result-title" id="resultTitle">승리!</div>
      <p class="subtitle" id="resultSub" style="margin-bottom:16px;">태풍 나비, 3개 도시를 초토화하다</p>
      <div class="stat-row"><span>최종 피해 점수</span><span id="statScore">0</span></div>
      <div class="stat-row"><span>파괴한 도시</span><span id="statCities">0곳</span></div>
      <div class="stat-row"><span>최대 풍속</span><span id="statRank">-- km/h</span></div>
      <div class="stat-row"><span>생존 시간</span><span id="statTime">0초</span></div>
      <button class="primary-btn" id="retryBtn" style="margin-top:18px;">다시 도전</button>
      <button class="ghost-btn" id="viewTrackBtn">🗺️ 이동 경로 보기</button>
    </div>
  </div>
  <button id="backToResultBtn">결과로 돌아가기</button>

  <div class="screen hidden" id="pauseScreen">
    <div class="card bracket-panel">
      <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
      <div class="title-main" style="font-size:22px;">일시정지</div>
      <button class="primary-btn" id="resumeBtn" style="margin-top:14px;">계속하기</button>
      <button class="ghost-btn" id="quitBtn">처음으로</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";

const CONFIG = {
  MAX_POWER:100, START_POWER:32, OCEAN_RECOVERY_BASE:6, LAND_DECAY_BASE:8,
  WEAK_RATIO:0.15, WEAK_DEATH_SECONDS:10, DAMAGE_SCALE:0.16,
  BASE_SPEED_PX:70, PLAY_ZOOM:6, CITY_HIT_RADIUS_MIN_M:32000, CITY_HIT_RADIUS_MAX_M:100000,
};
// 등급(열대저압부/태풍/강한 태풍 ...) 명칭 없이, 세력(0~100%)에 따라 매끄럽게 변하는 연속 스탯
function stormStats(power){
  const r = Math.max(0, Math.min(1, power / CONFIG.MAX_POWER));
  return {
    r,
    speedMul: 0.75 + r*0.65,
    sizeMul: 0.72 + r*0.66,
    spin: 9.0 - r*4.5,
    dmgMul: 0.5 + r*2.0,
    windKmh: Math.round(30 + r*250),
  };
}
function currentHitRadius(r){
  return CONFIG.CITY_HIT_RADIUS_MIN_M + (CONFIG.CITY_HIT_RADIUS_MAX_M - CONFIG.CITY_HIT_RADIUS_MIN_M) * r;
}
const RANDOM_NAMES = ["나비","매미","루사","차바","힌남노","독수리","송다","트라세","무란","콩레이","제비","곤파스"];
function isEasterEgg(name){ return name.indexOf('민서') !== -1; } // "민서"가 들어가면 발동

const CONTINENTS = [
  [[-165,68],[-165,60],[-140,60],[-130,55],[-125,49],[-124,40],[-117,32],[-106,31],[-97,26],[-97,18],
   [-90,16],[-85,10],[-80,9],[-77,8],[-80,25],[-81,31],[-75,35],[-70,41],[-67,45],[-60,50],
   [-65,60],[-75,62],[-85,68],[-95,70],[-110,72],[-130,70],[-150,70],[-165,68]],
  [[-77,8],[-80,0],[-81,-5],[-80,-18],[-70,-30],[-71,-40],[-68,-52],[-65,-55],[-58,-52],[-53,-35],
   [-48,-25],[-40,-15],[-35,-8],[-40,-2],[-50,2],[-60,8],[-70,10],[-77,8]],
  [[-10,36],[-9,43],[-5,48],[0,51],[5,58],[10,60],[20,60],[30,60],[40,66],[60,68],[80,73],[100,75],
   [120,73],[140,60],[145,50],[140,45],[135,35],[130,33],[125,38],[122,30],[110,20],[105,10],
   [100,6],[95,15],[90,22],[85,20],[80,8],[75,10],[70,20],[60,25],[50,25],[48,30],[45,35],
   [35,36],[28,36],[20,40],[15,38],[10,40],[0,38],[-10,36]],

function pointInPolygon(lon, lat, poly){
  let inside = false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
function makeRing(pts){
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  for (const p of pts){
    if (p[0]<minLon) minLon=p[0]; if (p[0]>maxLon) maxLon=p[0];
    if (p[1]<minLat) minLat=p[1]; if (p[1]>maxLat) maxLat=p[1];
  }
  return { pts, minLon, maxLon, minLat, maxLat };
}
// 기본값: 손으로 근사한 대륙 윤곽선 (실제 데이터 로딩 실패 시 폴백용)
let LAND_RINGS = CONTINENTS.map(makeRing);
function isLand(lon, lat){
  if (lat < -62) return true;
  for (const ring of LAND_RINGS){
    if (lon < ring.minLon-0.05 || lon > ring.maxLon+0.05 || lat < ring.minLat-0.05 || lat > ring.maxLat+0.05) continue;
    if (pointInPolygon(lon, lat, ring.pts)) return true;
  }
  return false;
}
// 실제 Natural Earth 1:110m 해안선 데이터(공개 도메인)를 불러와 정확한 육지/바다 경계로 교체
async function loadRealCoastline(){
  try{
    const res = await fetch('https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_land.geojson');
    const geo = await res.json();
    const rings = [];
    for (const f of geo.features){
      const geom = f.geometry; if (!geom) continue;
      const polys = geom.type==='Polygon' ? [geom.coordinates] : (geom.type==='MultiPolygon' ? geom.coordinates : []);
      for (const poly of polys){ if (poly[0] && poly[0].length>=3) rings.push(makeRing(poly[0])); }
    }
    if (rings.length > 10) LAND_RINGS = rings;
    console.log('실제 해안선 데이터 적용 완료 (' + rings.length + '개 폴리곤)');
  } catch(e){
    console.warn('실제 해안선 데이터를 불러오지 못해 근사 데이터로 계속합니다.', e);
  }
}
function terrainMultiplier(lon, lat){
  for (const m of MOUNTAINS){ if (lon>=m.lon0&&lon<=m.lon1&&lat>=m.lat0&&lat<=m.lat1) return 2.4; }
  return 1.0;
}
function seaTempMultiplier(lat){ const a=Math.abs(lat); if (a<20) return 1.5; if (a<40) return 1.0; return 0.35; }

// 기존 목록과 가까운 도시는 중복으로 보고 건너뜀 (12km 이내)
function mergeCities(base, extra){
  const merged = base.slice();
  for (const e of extra){
    if (e.forceLabel){ merged.push(e); continue; } // 항상 포함 (이스터에그 등 특수 지점은 근처 중복이 있어도 유지)
    const dup = merged.some(c => map.distance([c.lat,c.lng],[e.lat,e.lng]) < 12000);
    if (!dup) merged.push(e);
  }
  return merged;
}

let cityRings = []; // 세력에 따라 반경을 갱신해야 하는 링들 (최적화를 위해 따로 관리)
function rebuildCities(list){
  cityLayerGroup.clearLayers();
  cityRings = [];
  CITIES = list.map(c=>{
    const baseRadius = c.small ? 3 : (c.dmg>=200?5:3);
    const marker = L.circleMarker([c.lat,c.lng], { radius: baseRadius, color:'#ffd166', fillColor:'#ffd166', fillOpacity:0.9, weight:1.1, interactive:false }).addTo(cityLayerGroup);
    if (c.dmg >= 160 || c.forceLabel){
      marker.bindTooltip(c.name, { permanent:true, direction:'top', className:'city-label', offset:[0,-4] });
    }
    // 최적화: 규모가 작은 도시는 점선 피해반경 원을 생략해 레이어 수를 줄임
    let ring = null;
    if (c.dmg >= 130 || c.forceLabel){
      ring = L.circle([c.lat,c.lng], { radius:CONFIG.CITY_HIT_RADIUS_MIN_M, color:'rgba(255,255,255,0.4)', weight:1, dashArray:'4,5', fill:false, interactive:false }).addTo(cityLayerGroup);
      cityRings.push(ring);
    }
    return { name:c.name, lat:c.lat, lng:c.lng, cap:c.dmg, dealt:0, destroyed:false, marker, ring };
  });
  specialCityRef = CITIES.find(c => c.name === '대구' || c.name === '민서집') || null;
}

// 해안에서 가까운 지점인지 판정 (주변 8방향 중 하나라도 바다면 해안으로 간주)
function isNearCoast(lat, lon){
  const d = 0.6;
  const dirs = [[d,0],[-d,0],[0,d],[0,-d],[d,d],[d,-d],[-d,d],[-d,-d]];
  for (const [dx,dy] of dirs){ if (!isLand(lon+dx, lat+dy)) return true; }
  return false;
}
// 실제 Natural Earth 대도시(인구 기반, 1:50m 해상도 — 훨씬 많은 도시 포함) 데이터를 불러와
// 해안가 도시만 골라 도시 목록을 대폭 확장
async function loadRealCities(){
  try{
    const res = await fetch('https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_populated_places.geojson');
    const geo = await res.json();
    let list = geo.features.map(f=>{
      const p = f.properties || {};
      const coords = f.geometry.coordinates; // [lon, lat]
      const pop = p.POP_MAX || p.POP_MIN || 0;
      return { name: p.NAME || p.NAMEASCII || '이름없음', lat: coords[1], lng: coords[0], pop };
    }).filter(c => c.pop > 15000 && isFinite(c.lat) && isFinite(c.lng));

    let coastal = list.filter(c => isNearCoast(c.lat, c.lng));
    if (coastal.length < 60) coastal = list; // 해안 판정이 너무 적게 나오면 전체 목록으로 대체

    coastal.sort((a,b)=>b.pop-a.pop);
    coastal = coastal.slice(0, 800); // 렌더링 부담 방지용 상한

    const upgraded = coastal.map(c => ({
      name: c.name, lat: c.lat, lng: c.lng,
      dmg: Math.max(50, Math.min(260, Math.round(c.pop/26000)))
    }));
    if (upgraded.length > 20){
      rebuildCities(mergeCities(upgraded, NE_ASIA_CITIES));
      console.log('실제 해안 도시 데이터 적용 완료 (' + upgraded.length + '개 도시 + 동북아 대량 추가)');
    }
  } catch(e){
    console.warn('실제 도시 데이터를 불러오지 못해 기본 도시 목록으로 계속합니다.', e);
  }
}

const trailLayerGroup = L.layerGroup().addTo(map);
let trackPoints = [];
let trackLine = null;
function pushTrail(latlng){
  if (trackPoints.length){
    const last = trackPoints[trackPoints.length-1];
    if (Math.abs(latlng.lng - last.lng) > 180){
      // 지도 랩어라운드(날짜변경선 통과) 시 선이 지도를 가로지르지 않도록 새 선분 시작
      trackLine = null;
    } else if (map.distance(latlng, last) < 1500){
      return; // 최적화: 2km 미만 이동은 점을 추가하지 않음 (포인트 수 절약, 선은 영구 유지)
    }
  }
  if (!trackLine){
    trackPoints = [];
    trackLine = L.polyline([], { color:'#ff2d2d', weight:3, opacity:0.95, lineJoin:'round', interactive:false }).addTo(trailLayerGroup);
  }
  trackPoints.push(latlng);
  trackLine.setLatLngs(trackPoints);
}
function resetTrail(){
  trailLayerGroup.clearLayers();
  trackPoints = []; trackLine = null;
}

// ── 날씨 예보: 현재 이동 방향/속도를 바탕으로 앞으로 몇 초 뒤 위치를 점선으로 미리 보여줌 ──
const forecastLine = L.polyline([], { color:'#ffd166', weight:2, opacity:0.55, dashArray:'2,8', interactive:false }).addTo(map);
const forecastDots = L.layerGroup().addTo(map);
function updateForecast(speedPxPerSec){
  const dirLen = Math.hypot(smoothInput.x, smoothInput.y);
  if (dirLen < 0.12){ forecastLine.setLatLngs([]); forecastDots.clearLayers(); return; }
  const dx = smoothInput.x/dirLen, dy = smoothInput.y/dirLen;
  const centerPt = map.getSize().divideBy(2);
  const pts = [];
  forecastDots.clearLayers();
  [2,4,6].forEach(sec=>{
    const px = speedPxPerSec * dirLen * sec;
    const targetPt = centerPt.add(L.point(dx*px, dy*px));
    const ll = map.containerPointToLatLng(targetPt);
    pts.push(ll);
    L.circleMarker(ll, { radius:3, color:'#ffd166', fillColor:'#ffd166', fillOpacity:0.5, weight:0, interactive:false }).addTo(forecastDots);
  });
  forecastLine.setLatLngs([map.getCenter(), ...pts]);
}

// ── 미니맵: 별도 지도 없이 캔버스로 세계지도/태풍 위치를 가볍게 그림 (최적화) ──
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');
const MINI_W = 130, MINI_H = 72;
function drawMinimap(lat, lng){
  minimapCtx.fillStyle = '#0a2c42';
  minimapCtx.fillRect(0,0,MINI_W,MINI_H);
  minimapCtx.fillStyle = '#5c6b47';
  for (const ring of LAND_RINGS){
    minimapCtx.beginPath();
    for (let i=0;i<ring.pts.length;i++){
      const p = ring.pts[i];
      const x = (p[0]+180)/360*MINI_W, y = (90-p[1])/180*MINI_H;
      if (i===0) minimapCtx.moveTo(x,y); else minimapCtx.lineTo(x,y);
    }
    minimapCtx.closePath();
    minimapCtx.fill();
  }
  const sx = (lng+180)/360*MINI_W, sy = (90-lat)/180*MINI_H;
  minimapCtx.fillStyle = '#ff2d2d';
  minimapCtx.beginPath(); minimapCtx.arc(sx,sy,3.2,0,Math.PI*2); minimapCtx.fill();
  minimapCtx.strokeStyle = 'rgba(255,45,45,0.5)'; minimapCtx.lineWidth = 1.5;
  minimapCtx.beginPath(); minimapCtx.arc(sx,sy,6,0,Math.PI*2); minimapCtx.stroke();
}


const joystickZone = document.getElementById('joystickZone');
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joyInput = { x:0, y:0 };
const keyInput = { x:0, y:0 }; // 컴퓨터 버전: WASD/방향키 지원
const smoothInput = { x:0, y:0 }; // 실제 이동에는 이 값을 사용 (지터 제거, 완전 부드러운 아날로그 느낌)
let joyActive=false, joyCenter={x:0,y:0};
const JOY_MAX=55;
function joyStart(cx,cy){ const r=joyBase.getBoundingClientRect(); joyCenter={x:r.left+r.width/2,y:r.top+r.height/2}; joyActive=true; joyMove(cx,cy); }
function joyMove(cx,cy){
  if (!joyActive) return;
  let dx=cx-joyCenter.x, dy=cy-joyCenter.y; const dist=Math.hypot(dx,dy);
  if (dist>JOY_MAX){ dx=dx/dist*JOY_MAX; dy=dy/dist*JOY_MAX; }
  joyKnob.style.transform=`translate(${dx-26}px, ${dy-26}px)`;
  joyInput.x=dx/JOY_MAX; joyInput.y=dy/JOY_MAX;
}
function joyEnd(){ joyActive=false; joyInput.x=0; joyInput.y=0; joyKnob.style.transform='translate(-50%,-50%)'; }
joystickZone.addEventListener('pointerdown', e=>{ joystickZone.setPointerCapture(e.pointerId); joyStart(e.clientX,e.clientY); });
joystickZone.addEventListener('pointermove', e=>{ if(joyActive) joyMove(e.clientX,e.clientY); });
joystickZone.addEventListener('pointerup', joyEnd);
joystickZone.addEventListener('pointercancel', joyEnd);

// 컴퓨터 버전: WASD / 방향키로도 조작 가능하게. 눌린 키 조합으로 방향 벡터를 만들고 정규화한다.
const heldKeys = new Set();
function recalcKeyInput(){
  let x=0, y=0;
  if (heldKeys.has('ArrowLeft') || heldKeys.has('a') || heldKeys.has('A')) x -= 1;
  if (heldKeys.has('ArrowRight')|| heldKeys.has('d') || heldKeys.has('D')) x += 1;
  if (heldKeys.has('ArrowUp')   || heldKeys.has('w') || heldKeys.has('W')) y -= 1;
  if (heldKeys.has('ArrowDown') || heldKeys.has('s') || heldKeys.has('S')) y += 1;
  const len = Math.hypot(x,y);
  if (len > 0){ keyInput.x = x/len; keyInput.y = y/len; } else { keyInput.x = 0; keyInput.y = 0; }
}
window.addEventListener('keydown', e=>{ heldKeys.add(e.key); recalcKeyInput(); });
window.addEventListener('keyup',   e=>{ heldKeys.delete(e.key); recalcKeyInput(); });
window.addEventListener('blur', ()=>{ heldKeys.clear(); recalcKeyInput(); });

// ── 사운드: 외부 음원 없이 Web Audio API로 바람 소리/충격음을 직접 합성 ──
const SoundManager = (function(){
  let ctx = null, windGain = null, windFilter = null, started = false;
  function ensureCtx(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function start(){
    ensureCtx();
    if (started || !ctx) return;
    started = true;
    // 바람 소리: 화이트노이즈 + 저역통과 필터 루프
    const bufSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer; noise.loop = true;
    windFilter = ctx.createBiquadFilter();
    windFilter.type = 'lowpass'; windFilter.frequency.value = 400;
    windGain = ctx.createGain(); windGain.gain.value = 0.0;
    noise.connect(windFilter); windFilter.connect(windGain); windGain.connect(ctx.destination);
    noise.start();
  }
  function setPower(r){
    if (!windGain || !windFilter) return;
    windGain.gain.setTargetAtTime(0.02 + r*0.09, ctx.currentTime, 0.4);
    windFilter.frequency.setTargetAtTime(300 + r*900, ctx.currentTime, 0.4);
  }
  function boom(){
    if (!ctx) return;
    const dur = 0.35;
    const buffer = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = 250;
    const gain = ctx.createGain(); gain.gain.value = 0.5;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
  }
  function blip(freq){
    if (!ctx) return;
    const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value = freq || 660;
    const gain = ctx.createGain(); gain.gain.value = 0.16;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.25);
  }
  // 민서집 파괴 전용: 오르내리는 사이렌 경보음
  function siren(){
    if (!ctx) return;
    const osc = ctx.createOscillator(); osc.type='sawtooth';
    const gain = ctx.createGain(); gain.gain.value = 0.14;
    osc.connect(gain); gain.connect(ctx.destination);
    const t0 = ctx.currentTime;
    for (let i=0;i<4;i++){
      osc.frequency.setValueAtTime(500, t0 + i*0.5);
      osc.frequency.linearRampToValueAtTime(900, t0 + i*0.5 + 0.25);
      osc.frequency.linearRampToValueAtTime(500, t0 + i*0.5 + 0.5);
    }
    gain.gain.setValueAtTime(0.14, t0);
    gain.gain.setValueAtTime(0.14, t0+1.9);
    gain.gain.linearRampToValueAtTime(0.0001, t0+2.1);
    osc.start(t0); osc.stop(t0+2.1);
  }
  function stop(){
    if (windGain) windGain.gain.value = 0;
    started = false;
  }
  return { start, setPower, boom, blip, siren, stop };
})();

const alertOverlay = document.getElementById('alertOverlay');
const alertBox = document.getElementById('alertBox');
let alertTimeout = null;
let priorityAlertUntil = 0;
function showAlert(text, priorityMs){
  const now = Date.now();
  if (now < priorityAlertUntil && !priorityMs) return; // 우선순위 경보가 떠 있는 동안은 일반 경보로 덮어쓰지 않음
  alertBox.textContent = text;
  clearTimeout(alertTimeout);
  if (priorityMs){
    alertOverlay.classList.remove('show'); void alertOverlay.offsetWidth;
    alertOverlay.classList.add('show'); alertOverlay.classList.add('persist');
    priorityAlertUntil = now + priorityMs;
    alertTimeout = setTimeout(()=>{
      alertOverlay.classList.remove('show'); alertOverlay.classList.remove('persist');
      priorityAlertUntil = 0;
    }, priorityMs);
  } else {
    alertOverlay.classList.remove('persist');
    alertOverlay.classList.remove('show'); void alertOverlay.offsetWidth;
    alertOverlay.classList.add('show');
    alertTimeout = setTimeout(()=>alertOverlay.classList.remove('show'), 600);
  }
}

function applyCityDamage(dt, stats, lat, lng){
  const powerRatio = world.power/CONFIG.MAX_POWER;
  const here = L.latLng(lat,lng);
  for (const c of CITIES){
    if (c.destroyed) continue;
    const dist = map.distance(here, [c.lat,c.lng]);
    if (dist > currentHitRadius(stats.r)) continue;
    const protectedNow = c.protectedUntil && world.elapsed < c.protectedUntil;
    const add = c.cap*powerRatio*stats.dmgMul*CONFIG.DAMAGE_SCALE*dt * (protectedNow ? 0.5 : 1);
    c.dealt = Math.min(c.cap, c.dealt+add); world.score += add;
    if (!protectedNow) c.marker.setStyle({ color:cityColor(c), fillColor:cityColor(c) });
    if (c.dealt>=c.cap && !c.destroyed){
      c.destroyed = true;
      if (world.elapsed - combo.lastTime <= COMBO_WINDOW) combo.count++; else combo.count = 1;
      combo.lastTime = world.elapsed;
      const comboMul = 1 + Math.min(combo.count-1, 4)*0.15;
      const bonus = c.cap * 0.25 * comboMul;
      world.score += bonus;
      if (combo.count >= 2){
        pushNews(`속보: 태풍 ${world.name}, ${c.name} 등 연쇄 강타...${combo.count}곳 연속 초토화`);
      } else {
        pushNews(`속보: ${c.name} 기능 완전 마비...태풍 ${world.name}에 초토화`);
      }
      cameraShake();
      showAlert(`🚨 ${c.name} 초토화`);
      SoundManager.boom();
      if (combo.count >= 2) SoundManager.blip(880);
      if (navigator.vibrate) navigator.vibrate([40,30,40]);

      // ── 이스터에그: 민서집이 파괴되면 특별 경보 발동 ──
      if (c.name === '민서집'){
        showAlert('🚨🚨 민서집 붕괴!! 🚨🚨', 10000);
        cameraShake();
        setTimeout(cameraShake, 250);
        SoundManager.siren();
        pushNews('속보: 민서집 완전히 무너지다');
        if (navigator.vibrate) navigator.vibrate([100,60,100,60,200]);
      }
    }
  }
}

function updateCompass(){
  let nearest = null, nearestDist = Infinity;
  const here = map.getCenter();
  for (const c of CITIES){
    if (c.destroyed) continue;
    const d = map.distance(here, [c.lat, c.lng]);
    if (d < nearestDist){ nearestDist = d; nearest = c; }
  }
  const wrap = document.getElementById('compassWrap');
  if (!nearest){ wrap.classList.remove('show'); return; }
  wrap.classList.add('show');
  const toRad = d=>d*Math.PI/180;
  const lat1=toRad(here.lat), lat2=toRad(nearest.lat), dLon=toRad(nearest.lng-here.lng);
  const y = Math.sin(dLon)*Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  const bearing = (Math.atan2(y,x)*180/Math.PI + 360) % 360;
  document.getElementById('compassArrow').style.transform = `rotate(${bearing}deg)`;
  document.getElementById('compassDist').textContent = Math.round(nearestDist/1000) + ' km · ' + nearest.name;
}

let lastTime = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-lastTime)/1000); lastTime = now;
  if (gameState===STATE.PLAYING){
    world.elapsed += dt;
    const stats = stormStats(world.power);
    const speed = CONFIG.BASE_SPEED_PX*stats.speedMul;
    // 조이스틱 원값을 그대로 쓰지 않고 매 프레임 부드럽게 보간해 이동이 각지지 않고 매끄럽게 느껴지도록 함
    const rawInput = joyActive ? joyInput : keyInput; // 컴퓨터 버전: 조이스틱을 안 쓰면 키보드 입력 사용
    const smoothing = 1 - Math.pow(0.001, dt); // 프레임레이트에 무관하게 일정한 부드러움 유지
    smoothInput.x += (rawInput.x - smoothInput.x) * smoothing;
    smoothInput.y += (rawInput.y - smoothInput.y) * smoothing;
    if (Math.abs(smoothInput.x)>0.01 || Math.abs(smoothInput.y)>0.01){
      map.panBy([smoothInput.x*speed*dt, smoothInput.y*speed*dt], { animate:false });
      trailTick += dt; if (trailTick>0.15){ trailTick=0; pushTrail(map.getCenter()); }
    }
    compassTick += dt; if (compassTick>0.4){ compassTick=0; updateCompass(); }
    ringTick += dt; if (ringTick>0.5){ ringTick=0; updateCityRings(stats.r); }
    forecastTick += dt; if (forecastTick>0.2){ forecastTick=0; updateForecast(speed); }
    minimapTick += dt; if (minimapTick>0.4){ minimapTick=0; drawMinimap(stormLatLng ? stormLatLng.lat : 0, stormLatLng ? stormLatLng.lng : 0); }
    breakwaterTick += dt; if (breakwaterTick>25){ breakwaterTick=0; triggerBreakwater(); }
    tickerUpdate(dt);
    const center = map.getCenter();
    stormLatLng = center;
    const lat = Math.max(-84, Math.min(84, center.lat));
    const lng = ((center.lng+180)%360+360)%360-180;
    if (isLand(lng,lat)){
      const tm = terrainMultiplier(lng,lat);
      world.power -= CONFIG.LAND_DECAY_BASE*tm*dt;
    } else {
      const sm = seaTempMultiplier(lat);
      world.power += CONFIG.OCEAN_RECOVERY_BASE*sm*dt;
    }
    // 육지/바다 여부와 상관없이, 태풍의 영향 반경 안에 도시가 들어오면 항상 피해를 입힌다.
    // (예전에는 태풍이 "육지 위"에 있을 때만 피해가 들어가서, 해안선 데이터 해상도 때문에
    //  작은 섬이 육지로 인식되지 않으면 영원히 파괴되지 않는 버그가 있었음)
    applyCityDamage(dt, stats, lat, lng);
    world.power = Math.max(0, Math.min(CONFIG.MAX_POWER, world.power));
    if (world.power/CONFIG.MAX_POWER<=CONFIG.WEAK_RATIO) world.weakTimer+=dt; else world.weakTimer=0;
    updateHUD();
    if (world.power<=0) endGame(false, '세력을 모두 잃고 소멸했습니다');
    else if (world.weakTimer>=CONFIG.WEAK_DEATH_SECONDS) endGame(false, '약화된 채로 오래 머물러 소산되었습니다');
  }
  requestAnimationFrame(loop);
}

const nameScreen = document.getElementById('nameScreen');
const resultScreen = document.getElementById('resultScreen');
const pauseScreen = document.getElementById('pauseScreen');
const locBanner = document.getElementById('locBanner');
const locConfirmWrap = document.getElementById('locConfirmWrap');
const locConfirmBtn = document.getElementById('locConfirmBtn');
const locMsg = document.getElementById('locMsg');
const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('keydown', e=>{ if (e.key==='Enter') document.getElementById('toLocationBtn').click(); });
const typhoonSprite = document.getElementById('typhoonSprite');

// 실제 태풍처럼 보이도록 로그 나선(logarithmic spiral) 좌표를 계산해 SVG 팔을 생성
function spiralPathD(cx, cy, startAngleDeg, turns, r0, r1, steps){
  let d = '';
  for (let i=0; i<=steps; i++){
    const t = i/steps;
    const angle = (startAngleDeg + t*turns*360) * Math.PI/180;
    const eased = Math.pow(t, 0.82); // 중심 부근은 촘촘하게, 바깥쪽은 넓게 — 실제 나선띠 느낌
    const r = r0 + (r1-r0)*eased;
    const x = cx + Math.cos(angle)*r;
    const y = cy + Math.sin(angle)*r;
    d += (i===0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
  }
  return d;
}
function buildTyphoonSprite(){
  const cx=80, cy=80;
  const armsGroup = document.getElementById('spiralArmsGroup');
  const bandsGroup = document.getElementById('rainbandsGroup');
  const svgNS = 'http://www.w3.org/2000/svg';

  // 5개의 비대칭 나선팔 (완전 대칭이 아니라 실제처럼 팔 길이·두께를 조금씩 다르게)
  const armDefs = [
    { angle:0,   turns:0.62, r0:11, r1:72, w:7.5 },
    { angle:70,  turns:0.58, r0:12, r1:66, w:6.5 },
    { angle:150, turns:0.66, r0:10, r1:74, w:6.0 },
    { angle:220, turns:0.55, r0:13, r1:60, w:5.0 },
    { angle:295, turns:0.60, r0:11, r1:68, w:6.8 },
  ];
  armDefs.forEach(a=>{
    const path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', spiralPathD(cx, cy, a.angle, a.turns, a.r0, a.r1, 26));
    path.setAttribute('class','armPath');
    path.setAttribute('fill','none');
    path.setAttribute('stroke-width', a.w);
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('opacity', 0.85);
    armsGroup.appendChild(path);
  });

  // 바깥쪽 흩어진 구름 뭉치(레인밴드) — 완전한 원이 아니라 불규칙하게 배치해 위성사진 느낌
  const wispSeed = [
    {ang:15,r:58,rad:10},{ang:55,r:66,rad:7},{ang:95,r:60,rad:9},{ang:140,r:70,rad:6},
    {ang:180,r:62,rad:11},{ang:215,r:68,rad:7},{ang:255,r:58,rad:9},{ang:300,r:72,rad:6},
    {ang:335,r:64,rad:8},
  ];
  wispSeed.forEach(w=>{
    const rad = w.ang*Math.PI/180;
    const x = cx + Math.cos(rad)*w.r, y = cy + Math.sin(rad)*w.r;
    const el = document.createElementNS(svgNS,'circle');
    el.setAttribute('cx', x.toFixed(2)); el.setAttribute('cy', y.toFixed(2)); el.setAttribute('r', w.rad);
    el.setAttribute('class','wispBlob'); el.setAttribute('opacity', 0.22);
    el.setAttribute('filter','url(#wispBlur)');
    bandsGroup.appendChild(el);
  });
  // 점선 궤도 두 겹 (은은하게)
  [{r:64,dash:'3,8'},{r:50,dash:'2,10'}].forEach(b=>{
    const el = document.createElementNS(svgNS,'circle');
    el.setAttribute('cx',cx); el.setAttribute('cy',cy); el.setAttribute('r',b.r);
    el.setAttribute('fill','none'); el.setAttribute('class','bandPath');
    el.setAttribute('stroke-width',1.2); el.setAttribute('stroke-dasharray',b.dash); el.setAttribute('opacity',0.3);
    bandsGroup.appendChild(el);
  });
}
buildTyphoonSprite();

document.getElementById('randomNameBtn').addEventListener('click', ()=>{
  nameInput.value = RANDOM_NAMES[Math.floor(Math.random()*RANDOM_NAMES.length)];
});
function playEasterEggIntro(callback){
  const el = document.getElementById('easterEggIntro');
  el.innerHTML = '<div id="eggAnimText">★ 전설의 태풍, 김민서 강림 ★</div>';
  const icons = ['💪','⚡','🌪️','🔥'];
  for (let i=0;i<10;i++){
    const s = document.createElement('span');
    s.className = 'eggFloat';
    s.textContent = icons[i % icons.length];
    s.style.left = (8 + Math.random()*84) + '%';
    s.style.animationDelay = (Math.random()*0.6) + 's';
    el.appendChild(s);
  }
  el.classList.add('show');
  setTimeout(()=>{ el.classList.remove('show'); callback(); }, 1800);
}

document.getElementById('toLocationBtn').addEventListener('click', ()=>{
  const v = nameInput.value.trim();
  world.name = v.length ? v.slice(0,10) : RANDOM_NAMES[Math.floor(Math.random()*RANDOM_NAMES.length)];
  document.getElementById('stormName').textContent = '태풍 ' + world.name;
  nameScreen.classList.add('hidden');

  const proceedToLocate = ()=>{
    gameState = STATE.LOCATE;
    locBanner.classList.add('show'); pendingStart=null;
    locConfirmWrap.classList.remove('show'); locConfirmBtn.disabled=true;
    locMsg.textContent = '🌊 실제 지도 위에서 태풍이 발생할 바다를 탭하세요 (드래그·핀치줌 가능)';
    locMsg.className = 'msg';
    map.setView([15,135], 3);
  };

  if (isEasterEgg(world.name)){
    playEasterEggIntro(proceedToLocate);
  } else {
    proceedToLocate();
  }
});
map.on('click', (e)=>{
  if (gameState !== STATE.LOCATE) return;
  const { lat, lng } = e.latlng;
  if (isLand(lng, lat)){
    locMsg.textContent = '🚫 육지에는 태풍이 발생할 수 없습니다. 바다를 탭하세요';
    locMsg.className = 'msg warn';
    if (navigator.vibrate) navigator.vibrate(80);
    pendingStart=null; locConfirmWrap.classList.remove('show'); locConfirmBtn.disabled=true;
    if (startMarker){ map.removeLayer(startMarker); startMarker=null; }
  } else {
    pendingStart = { lat, lng };
    locMsg.textContent = '📍 발생 지점을 선택했습니다';
    locMsg.className = 'msg';
    locConfirmWrap.classList.add('show'); locConfirmBtn.disabled=false;
    if (startMarker) map.removeLayer(startMarker);
    startMarker = L.circleMarker([lat,lng], { radius:10, color:'#4fd1c5', weight:2, fill:false }).addTo(map);
  }
});
locConfirmBtn.addEventListener('click', ()=>{
  if (!pendingStart) return;
  world.power = CONFIG.START_POWER; world.weakTimer=0; world.elapsed=0; world.score=0;
  resetTrail();
  CITIES.forEach(c=>{ c.dealt=0; c.destroyed=false; c.protectedUntil=0; c.marker.setStyle({ color:'#ffd166', fillColor:'#ffd166' }); });
  if (specialCityRef){
    if (isEasterEgg(world.name)){
      specialCityRef.name = '민서집';
      specialCityRef.marker.setTooltipContent('민서집');
      specialCityRef.marker.setRadius(3);
    } else {
      specialCityRef.name = '대구';
      specialCityRef.marker.setTooltipContent('대구');
      specialCityRef.marker.setRadius(specialCityRef.cap>=200?5:3);
    }
  }
  if (startMarker){ map.removeLayer(startMarker); startMarker=null; }
  priorityAlertUntil = 0; clearTimeout(alertTimeout);
  alertOverlay.classList.remove('show'); alertOverlay.classList.remove('persist');
  map.setView([pendingStart.lat, pendingStart.lng], CONFIG.PLAY_ZOOM, { animate:false });
  map.dragging.disable();
  locBanner.classList.remove('show'); locConfirmWrap.classList.remove('show');
  document.getElementById('hud').classList.add('show'); joystickZone.classList.add('show');
  typhoonSprite.classList.add('show');
  document.getElementById('compassWrap').classList.add('show');
  document.getElementById('minimapWrap').classList.add('show');
  newsTicker.classList.add('show');
  combo = { count:0, lastTime:-999 }; lastPowerBucket = null; lastPowerNewsTime = -999; breakwaterTick = 0;
  updateCityRings(stormStats(world.power).r);
  newsQueue = []; newsTimer = 0;
  pushNews(`속보: 태풍 ${world.name} 발생...기상당국 예의주시`);
  updateHUD(); updateCompass();
  SoundManager.start();
  gameState = STATE.PLAYING;
});
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if (gameState!==STATE.PLAYING) return;
  gameState = STATE.PAUSED; pauseScreen.classList.remove('hidden');
  SoundManager.setPower(0);
});
document.getElementById('resumeBtn').addEventListener('click', ()=>{
  pauseScreen.classList.add('hidden'); lastTime = performance.now(); gameState = STATE.PLAYING;
  SoundManager.setPower(stormStats(world.power).r);
});
document.getElementById('quitBtn').addEventListener('click', resetToTitle);
document.getElementById('retryBtn').addEventListener('click', resetToTitle);
document.getElementById('viewTrackBtn').addEventListener('click', ()=>{
  resultScreen.classList.add('inspecting');
  document.getElementById('backToResultBtn').classList.add('show');
  if (trackPoints.length) map.fitBounds(L.polyline(trackPoints).getBounds(), { padding:[40,40] });
});
document.getElementById('backToResultBtn').addEventListener('click', ()=>{
  resultScreen.classList.remove('inspecting');
  document.getElementById('backToResultBtn').classList.remove('show');
});
function resetToTitle(){
  pauseScreen.classList.add('hidden'); resultScreen.classList.add('hidden');
  resultScreen.classList.remove('inspecting');
  document.getElementById('backToResultBtn').classList.remove('show');
  document.getElementById('hud').classList.remove('show'); joystickZone.classList.remove('show');
  typhoonSprite.classList.remove('show');
  document.getElementById('compassWrap').classList.remove('show');
  document.getElementById('minimapWrap').classList.remove('show');
  forecastLine.setLatLngs([]); forecastDots.clearLayers();
  SoundManager.stop();
  newsTicker.classList.remove('show');
  map.dragging.enable(); map.scrollWheelZoom.enable(); map.touchZoom.enable();
  nameInput.value=''; nameScreen.classList.remove('hidden'); gameState = STATE.NAME;
}

requestAnimationFrame(loop);
})();
</script>
